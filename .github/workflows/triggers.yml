
name: CI/CD

on:
  push:
    branches:
      - socle
      - 'experience/**'

  pull_request:
    branches:
      - socle
      - 'experience/**'

  workflow_dispatch:

jobs:
  ci:
    name: Exécuter la CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  cd:
    name: Exécuter la CD
    needs: ci
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/cd.yml
    secrets: inherit
