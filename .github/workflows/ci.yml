
name: CI

on:
  workflow_call:

jobs:
  ci:
    name: Vérification et préparation
    runs-on: self-hosted

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements_dev.txt

      - name: Vérifier la configuration de déploiement
        shell: bash
        run: bash scripts/validate-deployment.sh check

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_dev.txt

      - name: Vérifier Django
        run: python manage.py check

      - name: Vérifier les migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Exécuter les tests
        run: python manage.py test

      - name: Vérifier Ruff
        run: ruff check .

      - name: Vérifier parametre
        run: lab-toolkit deployment validate

      - name: Préparer l'artefact backend
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz \
            --output=backend-app.tar.gz HEAD

      - name: Publier l'artefact backend
        uses: actions/upload-artifact@v4
        with:
          name: django-backend
          path: backend-app.tar.gz
          if-no-files-found: error
          retention-days: 7
