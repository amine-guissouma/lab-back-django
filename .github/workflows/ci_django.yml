
name: CI/CD

on:
  push:
    branches:
      - socle
      - 'experience/**'

  pull_request:
    branches:
      - socle
      - 'experience/**'

  workflow_dispatch:

jobs:

  # ======================================================
  # CI - VÉRIFICATION ET PRÉPARATION
  # ======================================================

  ci:
    name: Vérification et préparation
    runs-on: self-hosted

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      # --------------------------------------------------
      # ENVIRONNEMENT DJANGO - PYTHON 3.12
      # --------------------------------------------------

      - name: Installer Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer les dépendances Django
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Vérifier Django
        run: python manage.py check

      - name: Vérifier les migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Exécuter les tests
        run: pytest

      - name: Vérifier Ruff
        run: ruff check .

      - name: Vérifier le formatage Ruff
        run: ruff format --check .

      - name: Vérifier les types avec Mypy
        run: mypy .

      # --------------------------------------------------
      # ENVIRONNEMENT LAB-TOOLKIT - PYTHON 3.14
      # --------------------------------------------------

      - name: Installer Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Installer lab-toolkit avec pipx
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install pipx

          # Lecture du dépôt lab-toolkit dans pyproject.toml.
          LAB_TOOLKIT_REPOSITORY="$(python -c '
          import pathlib
          import tomllib

          with pathlib.Path("pyproject.toml").open("rb") as file:
              config = tomllib.load(file)

          external_tools = config["tool"]["lab"]["external-tools"]

          assert external_tools["installer"] == "pipx"
          assert external_tools["python"] == ">=3.14"

          print(external_tools["lab-toolkit"])
          ')"

          # Installation isolée avec Python 3.14.
          python -m pipx install \
            --python "$(python -c 'import sys; print(sys.executable)')" \
            "$LAB_TOOLKIT_REPOSITORY"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"

          lab-toolkit --version

      - name: Vérifier les paramètres de déploiement
        run: lab-toolkit deployment validate

      # --------------------------------------------------
      # PRÉPARATION DE L'ARTEFACT
      # --------------------------------------------------

      - name: Préparer l'artefact backend
        shell: bash
        run: |
          set -euo pipefail

          git archive --format=tar.gz \
            --output=backend-app.tar.gz HEAD

      - name: Publier l'artefact backend
        uses: actions/upload-artifact@v5
        with:
          name: django-backend
          path: backend-app.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ======================================================
  # DÉPLOIEMENT
  # ======================================================

  deploy:
    name: Déployer sur la VM Deploy
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: self-hosted

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6
      - name: Télécharger l'artefact backend
        uses: actions/download-artifact@v5
        with:
          name: django-backend
          path: artifact/

      # --------------------------------------------------
      # CONFIGURATION SSH
      # --------------------------------------------------

      - name: Préparer les accès SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          KEY_FILE="$RUNNER_TEMP/deploy_key"
          KNOWN_HOSTS_FILE="$RUNNER_TEMP/deploy_known_hosts"

          printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"
          chmod 600 "$KNOWN_HOSTS_FILE"

      # --------------------------------------------------
      # TRANSFERT ET DÉPLOIEMENT
      # --------------------------------------------------

      - name: Transférer et déployer le backend
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          REMOTE_DIR: ${{ steps.deployment.outputs.remote_dir }}
          DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE }}
        run: |
          set -euo pipefail

          KEY_FILE="$RUNNER_TEMP/deploy_key"
          KNOWN_HOSTS_FILE="$RUNNER_TEMP/deploy_known_hosts"
          ARCHIVE="backend-app.tar.gz"
          REMOTE_ARCHIVE="/tmp/$ARCHIVE"

          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$REMOTE_DIR"
          test -n "$DEPLOY_SERVICE"
          test -f "artifact/$ARCHIVE"

          SSH_OPTIONS=(
            -i "$KEY_FILE"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE"
          )

          # Transfert de l'artefact.
          scp "${SSH_OPTIONS[@]}" \
            "artifact/$ARCHIVE" \
            "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_ARCHIVE"

          # Installation et redémarrage sur le serveur.
          ssh "${SSH_OPTIONS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$REMOTE_DIR' '$DEPLOY_SERVICE' '$REMOTE_ARCHIVE'" <<'REMOTE'
          set -euo pipefail

          REMOTE_DIR="$1"
          DEPLOY_SERVICE="$2"
          REMOTE_ARCHIVE="$3"

          mkdir -p "$REMOTE_DIR"

          tar -xzf "$REMOTE_ARCHIVE" -C "$REMOTE_DIR"

          cd "$REMOTE_DIR"

          # Environnement virtuel de production.
          python3 -m venv .venv

          .venv/bin/python -m pip install --upgrade pip

          # Installation des dépendances obligatoires
          # directement depuis pyproject.toml.
          .venv/bin/python - <<'PY'
          import pathlib
          import subprocess
          import sys
          import tomllib

          with pathlib.Path("pyproject.toml").open("rb") as file:
              config = tomllib.load(file)

          dependencies = config["project"].get("dependencies", [])

          subprocess.check_call([
              sys.executable,
              "-m",
              "pip",
              "install",
              *dependencies,
          ])
          PY

          # Opérations Django.
          .venv/bin/python manage.py migrate --noinput
          .venv/bin/python manage.py collectstatic --noinput

          # Redémarrage du service Django.
          sudo systemctl restart "$DEPLOY_SERVICE"

          rm -f "$REMOTE_ARCHIVE"
          REMOTE

      # --------------------------------------------------
      # NETTOYAGE
      # --------------------------------------------------

      - name: Nettoyer les fichiers temporaires SSH
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/deploy_key"
          rm -f "$RUNNER_TEMP/deploy_known_hosts"
