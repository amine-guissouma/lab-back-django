repos:

  - repo: local
    hooks:

      - id: ruff-format
        name: Ruff format
        entry: ruff format
        language: system
        types: [ python ]

      - id: ruff-check
        name: Ruff check
        entry: ruff check
        language: system
        types: [ python ]

      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [ python ]

      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
